[project]
name = "backend-failure-lab"
version = "0.1.0"
description = "Practical backend failure cases for Python backend developers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "pydantic",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
